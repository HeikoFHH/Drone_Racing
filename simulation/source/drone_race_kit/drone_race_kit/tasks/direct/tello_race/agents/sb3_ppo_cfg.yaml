# SB3 PPO for AS-Tello-Race-v0 (single Tello, two-pole lap).
seed: 42

n_timesteps: !!float 5e7
policy: 'MlpPolicy'
n_steps: 256
n_minibatches: 4
gae_lambda: 0.95
gamma: 0.995
n_epochs: 5
ent_coef: 0.005
learning_rate: !!float 3e-4
clip_range: 0.2
policy_kwargs:
  activation_fn: 'nn.ELU'
  net_arch: [256, 256]
  log_std_init: -0.5
  squash_output: False
vf_coef: 1.0
max_grad_norm: 1.0
target_kl: 0.02
normalize_input: True
normalize_value: False
freeze_normalization: False
clip_obs: 10.0
frame_stack: 4
device: "cuda:0"
