name: Policy offline checks

on:
  push:
    branches: [maude/policy-integration]
    paths:
      - 'policy_integration/**'
      - 'live_control/**'
      - '.github/workflows/policy-offline.yml'
  pull_request:
    paths:
      - 'policy_integration/**'
      - 'live_control/**'
      - '.github/workflows/policy-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - name: Contract and failure tests
        run: python -m unittest policy_integration.test_policy policy_integration.test_stress_sim policy_integration.test_turns policy_integration.test_dashboard -v
      - name: Generate scenario report, including known mission failures
        run: python -m policy_integration.stress_sim --seeds 20 --output policy_integration/reports/stress_sim.json
      - name: Turn and visibility smoke scenarios
        run: python -m policy_integration.turn_sim --seeds 2 --output policy_integration/reports/turn_ci.json
      - name: Install live dashboard policy dependencies
        run: python -m pip install -r live_control/requirements.txt -e cal_and_map
      - name: Live bridge lifecycle and actual policy integration
        run: python -m unittest live_control.test_bridge live_control.test_policies -v
      - name: Check browser control script
        run: node --check live_control/app.js
